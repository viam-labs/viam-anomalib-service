# Publishes the module to the Viam registry on version tags.
#
# meta.json lists linux/amd64 and windows/amd64. Linux is built by Viam's cloud build, restricted with
# --platforms so the Linux build containers don't attempt Windows (PyInstaller can't cross-compile).
# Windows is built natively on a windows runner and uploaded with the viam CLI for the same version.
#
# Required repository secrets: viam_key_id, viam_key_value (an org API key with module write access).
on:
  push:
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]+"
      - "v?[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

jobs:
  publish-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install viam CLI
        run: |
          curl -sSL -o viam https://storage.googleapis.com/packages.viam.com/apps/viam-cli/viam-cli-stable-linux-amd64
          chmod +x viam && sudo mv viam /usr/local/bin/viam && viam version
      - name: Update registry metadata and run the Linux cloud build
        env:
          VIAM_KEY_ID: ${{ secrets.viam_key_id }}
          VIAM_KEY_VALUE: ${{ secrets.viam_key_value }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          viam login api-key --key-id "$VIAM_KEY_ID" --key "$VIAM_KEY_VALUE"
          viam module update --module meta.json
          BUILD_ID=$(viam module build start --module meta.json --version "$VERSION" --ref "$GITHUB_SHA" \
                       --platforms linux/amd64 | head -n1)
          echo "cloud build id: $BUILD_ID"
          viam module build logs --id "$BUILD_ID" --wait --group-logs

  publish-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build module
        run: ./setup.sh && ./build.sh
      - name: Smoke test the frozen binary
        run: ./dist/main.exe --selftest
      - name: Install viam CLI
        run: |
          curl -sSL -o viam.exe https://storage.googleapis.com/packages.viam.com/apps/viam-cli/viam-cli-latest-windows-amd64.exe
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Upload windows/amd64
        env:
          VIAM_KEY_ID: ${{ secrets.viam_key_id }}
          VIAM_KEY_VALUE: ${{ secrets.viam_key_value }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          viam.exe login api-key --key-id "$VIAM_KEY_ID" --key "$VIAM_KEY_VALUE"
          viam.exe module upload --version "$VERSION" --platform windows/amd64 --upload dist/archive.tar.gz
